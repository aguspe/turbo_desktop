<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbo Desktop</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        background: #1a1a2e;
        color: #e0e0e0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        -webkit-user-select: none;
      }
      .container {
        text-align: center;
        max-width: 500px;
        padding: 2rem;
      }
      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, #e73c7e, #ee7752);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subtitle {
        color: #888;
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }
      .status {
        background: #16213e;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        border: 1px solid #2a2a4a;
      }
      .status h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #666;
        margin-bottom: 0.75rem;
      }
      .status p {
        font-size: 1rem;
        line-height: 1.6;
      }
      code {
        background: #2a2a4a;
        padding: 0.15em 0.5em;
        border-radius: 4px;
        font-size: 0.9em;
        color: #e73c7e;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #2a2a4a;
        border-top-color: #e73c7e;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <h1>Turbo Desktop</h1>
      <p class="subtitle">Connecting to your Rails server...</p>
      <div class="status">
        <h2>Configuration</h2>
        <p>
          If you see this screen, the app couldn't connect to your Rails server.<br>
          Make sure your server is running at the URL specified in<br>
          <code>turbo-desktop.config.json</code>
        </p>
      </div>
      <div class="status">
        <h2>Quick Start</h2>
        <p>
          <code>rails server</code> &mdash; then reload this window
        </p>
      </div>
    </div>
    <script src="turbo-desktop.js"></script>
  </body>
</html>
